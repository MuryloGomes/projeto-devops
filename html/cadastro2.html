
<!DOCTYPE html>
<html lang="pt-br">
<head>
	<link rel="stylesheet" href="../styles/cadastro css/cadastro_cep.css">
	<link rel="icon" href="../images/dog-solid.svg">
	<title>Doacão - Cadastro</title>
	<script src="../javascript/cep.js" defer></script>
</head>
<body>

	<section>
		<div class="form-box">
			<div class="form-value">
				<div class="logo">
				<a href="../../index.html"> <img src="../images/BordaLogoPng.png" alt="Ender Softwares"> </a>
				</div>
				<form id="address-form">
					<h2>Informações de Endereço</h2>

					<div class="inputbox">
                    <input id="cep" type="text" name="cep"  
                    maxlength="8"
                    minlength="8"
					required>
					<label for="cep">CEP</label>
					</div>


					<div class="inputbox">
                    <input id="estado" type="text" name="estado" required>
					<label for="estado">Estado</label>
					</div>


					<div class="inputbox">
                    <input id="cidade" type="text" name="cidade"  required
                    data-input disable >
					<label for="cidade">Cidade</label>
					</div>

					
					<div class="inputbox">
                    <input id="pais" type="text" name="pais" 
                    required
                    data-input disable >
					<label for="pais">País</label>
					</div>


					
					<button class="botao" type="submit">Continuar</button>

				</form>
			</div>
		</div>
	</section>
	<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
	<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
	<script src="../javascript/cadastro2.js"></script>
</body>

</html>
